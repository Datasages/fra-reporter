version: '3.8'

services:
  fra-report-generator:
    build: .
    container_name: fra-report-generator
    environment:
      # JVM Configuration
      JAVA_OPTS: "-Xmx4g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

      # AWS Configuration (use IAM roles in production)
      AWS_DEFAULT_REGION: us-east-1
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # Configuration file override
      CONFIG_FILE: "/app/config/config.properties"

    volumes:
      # Mount configuration from host
      - ./build/config.properties:/app/config/config.properties:ro

      # Mount templates directory
      - ./build:/app/templates:ro

      # Optional: Mount logs directory
      - ./logs:/app/logs

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 4G
          cpus: '1.0'

    # Restart policy
    restart: unless-stopped

    # Health check override
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health" , "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Local MongoDB for development/testing
  mongodb:
    image: mongo:6.0
    container_name: fra-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    restart: unless-stopped
    profiles:
      - development

volumes:
  mongodb_data: