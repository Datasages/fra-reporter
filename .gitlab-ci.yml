image: maven:3.8.5-openjdk-17

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  MAVEN_CLI_OPTS: '-B --no-transfer-progress'

stages:
  - build
  - test
  - docker-build
  - release

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

# Build and compile the application
maven-build:
  stage: build
  script:
    - mvn clean compile ${MAVEN_CLI_OPTS}
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# Run unit tests
unit-tests:
  stage: test
  dependencies:
    - maven-build
  script:
    - mvn test ${MAVEN_CLI_OPTS} -Dtest="*Test,!*IntegrationTest,!*BenchmarkTest" -DfailIfNoTests=false
  artifacts:
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/*.xml
    expire_in: 1 week

# Package the application
maven-package:
  stage: test
  dependencies:
    - maven-build
  script:
    - mvn package ${MAVEN_CLI_OPTS} -DskipTests
  artifacts:
    paths:
      - target/*.jar
      - target/*-jar-with-dependencies.jar
    expire_in: 1 week

# Build and push Docker image
docker-build-push:
  stage: docker-build
  image: docker:27
  services:
    - name: docker:dind
      command: ["--tls=false"]
  dependencies:
    - maven-package
  before_script:
    - mkdir ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > ~/.docker/config.json
  script:
    # Set IMAGE_TAG: use git tag if available, otherwise commit SHA
    - IMAGE_TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - echo "Building image with tag: $IMAGE_TAG"
    - docker build -t $CI_REGISTRY_IMAGE:${IMAGE_TAG} .
    - docker push $CI_REGISTRY_IMAGE:${IMAGE_TAG}
    # Push latest only for main branch or tags
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $CI_REGISTRY_IMAGE:${IMAGE_TAG} $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  rules:
    - if: $CI_COMMIT_TAG  # Run on tags
    - if: $CI_COMMIT_BRANCH == "main"  # Run on main
    - if: $CI_COMMIT_BRANCH  # Run on other branches (manual)
      when: manual

# Create GitLab release for tags
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG of FRA Report Generator"
  rules:
    - if: $CI_COMMIT_TAG
