init.time = 30

# Set to 0 for auto-detection of previous month
# For testing, we'll set to January 2026 to test December 2025 reports
init.year = 2026
init.month = 1

org.slf4j.simpleLogger.defaultLogLevel = trace

reports.scac = amtk
reports.scac.cibos = amtk.b:cibos
reports.scac.gbos = "amtk.b:gb.nec", "amtk.b:gb.me"
reports.railroadname = Amtrak

reports.mongo.batchsize = 100000
# For testing, use local MongoDB for report metadata
reports.mongo.url = mongodb://mongodb:27017
reports.mongo.database = amtk_reports
reports.mongo.collection = amtk_reports

# Messages come from the synced MongoDB
messages.mongo.url = mongodb://mongodb:27017
messages.mongo.database = amtk_reports
messages.mongo.collection = amtk_messages

# AWS S3 configuration - will use LocalStack endpoint via AWS_ENDPOINT_URL env var
aws.api.region = us-east-1
aws.api.S3bucket = rwn-amtk-report-prod
aws.s3bucket.report = rwn-amtk-report-prod
aws.s3bucket.base.url = http://localstack:4566/rwn-amtk-report-prod/
